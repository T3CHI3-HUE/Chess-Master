<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="g" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5edd2"/>
      <stop offset="65%" stop-color="#f1e7c1"/>
      <stop offset="100%" stop-color="#e7d9a8"/>
    </radialGradient>
  </defs>

  <!-- background disk (brown only) -->
  <circle cx="96" cy="96" r="86" fill="#78491a"/>
  <!-- subtle highlight ring (cream) -->
  <circle cx="96" cy="96" r="78" fill="none" stroke="#f5edd2" stroke-opacity="0.35" stroke-width="4"/>

  <!-- King silhouette (cream + small brown shadow) -->
  <g transform="translate(0,2)">
    <!-- shadow -->
    <path d="M56 140 C56 124 70 112 96 112 C122 112 136 124 136 140 Z" fill="#3a220f" fill-opacity="0.35"/>

    <!-- base -->
    <path d="M66 142 C66 132 78 120 96 120 C114 120 126 132 126 142 Z" fill="url(#g)"/>

    <!-- neck -->
    <path d="M79 108 C79 98 87 90 96 90 C105 90 113 98 113 108 L113 120 L79 120 Z" fill="url(#g)"/>

    <!-- crown -->
    <path d="M74 88 L96 55 L118 88 Z" fill="url(#g)"/>

    <!-- inner cut -->
    <path d="M86 88 L96 70 L106 88 Z" fill="#78491a" fill-opacity="0.25"/>

    <!-- top jewel -->
    <path d="M96 50 C103 57 103 66 96 72 C89 66 89 57 96 50 Z" fill="#f5edd2"/>

    <!-- little crenellations -->
    <rect x="66" y="86" width="12" height="6" rx="3" fill="#f5edd2" fill-opacity="0.85"/>
    <rect x="114" y="86" width="12" height="6" rx="3" fill="#f5edd2" fill-opacity="0.85"/>
  </g>
</svg>
