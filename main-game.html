<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <div id="status">White's Turn</div>
    <div id="turn-indicator" class="turn-indicator">White to play</div>
    <div id="board-wrap" style="position: relative; display: inline-block;">


      <div id="chessboard"></div>




      <!-- Board-wide announcement overlay (check / checkmate / stalemate) -->
      <div id="game-announcement" class="game-announcement" aria-live="polite" aria-atomic="true" hidden>
        <div id="game-announcement-text" class="game-announcement-text"></div>
      </div>


    </div>



    <button id="reset-btn">New Game</button>



    <button id="history-toggle">Move History</button>
    <div id="move-history" style="display: none;"></div>
  </div>

  <script src="chess.js"></script>
  <script src="ai.js"></script>
  <script src="main-game.js"></script>




  <footer class="app-footer">2026 Mirage Visuals. All rights reserved.</footer>


</body>
</html>
