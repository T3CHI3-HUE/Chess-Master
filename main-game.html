<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <div id="status">White's Turn</div>
    <div id="turn-indicator" class="turn-indicator">White to play</div>
    <div id="board-wrap" style="position: relative; display: inline-block;">
      <div id="chessboard"></div>

      <!-- Overlay file labels above the board squares -->
      <div id="file-labels" style="position:absolute; top:calc(-1 * var(--cell-size) * 0.45); left:0; right:0; height:var(--cell-size); display:grid; grid-template-columns: repeat(8, var(--cell-size)); grid-auto-rows: 1fr; align-items:center; justify-items:center; font-size:12px; color: rgba(255,255,255,0.9); pointer-events:none;">
        <div>a</div><div>b</div><div>c</div><div>d</div><div>e</div><div>f</div><div>g</div><div>h</div>
      </div>



      <!-- Overlay rank labels (left of squares, shifted outward and vertically centered) -->
      <div id="rank-labels" style="position:absolute; top:0; left:calc(-1 * var(--cell-size) * 0.18); bottom:0; display:grid; grid-template-rows: repeat(8, var(--cell-size)); font-size:12px; color: rgba(255,255,255,0.9); align-items:center; justify-items:center; pointer-events:none;">

        <div>8</div><div>7</div><div>6</div><div>5</div><div>4</div><div>3</div><div>2</div><div>1</div>
      </div>

    </div>

    <button id="reset-btn">New Game</button>



    <button id="history-toggle">Move History</button>
    <div id="move-history" style="display: none;"></div>
  </div>

  <script src="chess.js"></script>
  <script src="ai.js"></script>
  <script src="main-game.js"></script>




  <footer class="app-footer">2026 Mirage Visuals. All rights reserved.</footer>


</body>
</html>
