<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <div id="status">White's Turn</div>
    <div id="turn-indicator" class="turn-indicator">White to play</div>
    <div id="board-wrap" style="position: relative; display: inline-block;">
      <div id="chessboard"></div>

      <!-- Overlay file labels (top of the board) -->
      <div id="file-labels" style="position:absolute; top:-18px; left:0; right:0; display:grid; grid-template-columns: repeat(8, 60px); font-size:12px; color: rgba(255,255,255,0.9);">
        <div>a</div><div>b</div><div>c</div><div>d</div><div>e</div><div>f</div><div>g</div><div>h</div>
      </div>

      <!-- Overlay rank labels (left side of the board) -->
      <div id="rank-labels" style="position:absolute; top:0; left:-22px; bottom:0; display:grid; grid-template-rows: repeat(8, 60px); font-size:12px; color: rgba(255,255,255,255,0.9); align-items:center; justify-items:center;">
        <div>8</div><div>7</div><div>6</div><div>5</div><div>4</div><div>3</div><div>2</div><div>1</div>
      </div>
    </div>

    <button id="reset-btn">New Game</button>



    <button id="history-toggle">Move History</button>
    <div id="move-history" style="display: none;"></div>
  </div>

  <script src="chess.js"></script>
  <script src="ai.js"></script>
  <script src="main-game.js"></script>




  <footer class="app-footer">2026 Mirage Visuals. All rights reserved.</footer>


</body>
</html>
